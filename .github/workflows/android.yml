name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Report build failure
        if: failure()
        run: |
          {
            echo 'Automatic Android build failed. Last 120 lines of Gradle output:'
            echo '~~~'
            tail -n 120 build.log 2>/dev/null || echo 'No Gradle log available'
            echo '~~~'
          } > failure-report.md
          gh issue create --title "Android build failure (run ${{ github.run_number }})" --body-file failure-report.md || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BuildFinance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
